spring.application.name=user-service
server.port=9060

#localhost - since we work with it via Docker container
spring.datasource.username=${MY_POSTGRES_USER:postgres}
spring.datasource.password=${MY_POSTGRES_PASSWORD:postgres}
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.url=${GA_MY_POSTGRES_ENDPOINT}/users_db
spring.datasource.driver-class-name=org.postgresql.Driver

#localhost - since we work with it via Docker container //todo DELETE MIGHT BE IF IT'S NEEDED
spring.data.redis.host=localhost
spring.data.redis.port=6300
spring.data.redis.timeout=5s
spring.data.redis.password=redis
spring.data.redis.username=redis

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true




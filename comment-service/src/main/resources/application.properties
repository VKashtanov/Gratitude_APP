spring.application.name=comment-service
server.port=9025

#localhost - since we work with it via Docker container
spring.datasource.username=${MY_POSTGRES_USER:postgres}
spring.datasource.password=${MY_POSTGRES_PASSWORD:postgres}
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.url=jdbc:postgresql://localhost:5400/comments_db
spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
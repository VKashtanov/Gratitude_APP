services:
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5400:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${GA_MY_POSTGRES_USER}
      - POSTGRES_PASSWORD=${GA_MY_POSTGRES_PASSWORD}
      - POSTGRES_DB=${GA_MY_POSTGRES_DB}
    volumes:
      - C:\opt\postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  redis:
    image: redis:8.2.5
    container_name: just-fire-redis
    ports:
      - "6300:6379"
#    command: redis-server --requirepass ${GA_REDIS_PASSWORD}
    restart: unless-stopped

  #  ZOOKEEPER and KAFKA
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: no
      ZOO_ENABLE_AUTH: yes
      ZOO_SERVER_USERS: ${GA_ZOOKEEPER_USER}
      ZOO_SERVER_PASSWORDS: ${GA_ZOOKEEPER_PASSWORD}
      ZOO_SUPER_USERS: ${GA_ZOOKEEPER_USER}     # Add the user to superuser list (full access)
    networks:
      - kafka-network

  kafka:
    image:  bitnamilegacy/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_CFG_ZOOKEEPER_SET_ACL: false
      KAFKA_ZOOKEEPER_USER: ${GA_ZOOKEEPER_USER}
      KAFKA_ZOOKEEPER_PASSWORD: ${GA_ZOOKEEPER_PASSWORD}
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      ALLOW_PLAINTEXT_LISTENER: yes
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - kafka-network

volumes:
  kafka_data:
    driver: local

networks:
  kafka-network:
    driver: bridge
  services:


    postgres:
      image: postgres:15
      container_name: postgres
      ports:
        - "5400:5432"
      environment:
        - POSTGRES_USER=${GA_MY_POSTGRES_USER}
        - POSTGRES_PASSWORD=${GA_MY_POSTGRES_PASSWORD}
        - POSTGRES_DB=users_db
      volumes:
        - C:\opt\postgres_data:/var/lib/postgresql/data
      restart: unless-stopped
      networks:
        - app-network


    minio:
      image: minio/minio:latest
      container_name: minio
      ports:
        - "9000:9000"   # S3 API port
        - "9001:9001"   # Web Console port
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      volumes:
        - minio_data:/data
      command: server /data --console-address ":9001"
      networks:
        - app-network

    redis:
      image: redis:8.2.5
      container_name: just-fire-redis
      ports:
        - "6300:6379"
  #    command: redis-server --requirepass ${GA_REDIS_PASSWORD}
      restart: unless-stopped
      networks:
        - app-network


    #  ZOOKEEPER and KAFKA
    zookeeper:
      image: zookeeper:3.9
      container_name: zookeeper
      ports:
        - "2181:2181"
      environment:
        ALLOW_ANONYMOUS_LOGIN: no
        ZOO_ENABLE_AUTH: yes
        ZOO_SERVER_USERS: ${GA_ZOOKEEPER_USER}
        ZOO_SERVER_PASSWORDS: ${GA_ZOOKEEPER_PASSWORD}
        ZOO_SUPER_USERS: ${GA_ZOOKEEPER_USER}     # Add the user to superuser list (full access)
      networks:
        - kafka-network

    kafka:
      image:  bitnamilegacy/kafka:3.7.0
      container_name: kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_CFG_ZOOKEEPER_SET_ACL: false  # diable access(права доступа) in Zookeper (easier way to start Kafka)
        KAFKA_ZOOKEEPER_USER: ${GA_ZOOKEEPER_USER}
        KAFKA_ZOOKEEPER_PASSWORD: ${GA_ZOOKEEPER_PASSWORD}
        KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092  # kafka broker address for working with msg
        KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092 # set inner listeners , that takes values from producers plainText, or ssl
        ALLOW_PLAINTEXT_LISTENER: yes # enable the plain connection ,no SSL for development
        KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_CFG_NUM_PARTITIONS: 3 # set default partition qty
      depends_on: # ensures that zookeeper starts earlier than kafka
        - zookeeper
      volumes:
        - kafka_data:/bitnami/kafka # inner path in container Kafka , it stores data there
      networks:
        - kafka-network

  volumes:
    kafka_data:
      driver: local
    minio_data:
      driver: local

  networks:
    kafka-network:
      driver: bridge
    app-network:
      driver: bridge